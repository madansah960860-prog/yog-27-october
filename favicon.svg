<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Thistledown Kitchen">
  <title>Thistledown Kitchen</title>
  <rect width="64" height="64" rx="10" fill="#3E4D2C"/>
  <!-- a thistle seed: seven hairs radiating from a small head, on a stem -->
  <g stroke="#F4F2E8" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="32" y1="26" x2="32" y2="52"/>
    <line x1="32" y1="26" x2="32" y2="11"/>
    <line x1="32" y1="26" x2="43.6" y2="16.6"/>
    <line x1="32" y1="26" x2="48.3" y2="26"/>
    <line x1="32" y1="26" x2="43.6" y2="35.4"/>
    <line x1="32" y1="26" x2="20.4" y2="35.4"/>
    <line x1="32" y1="26" x2="15.7" y2="26"/>
    <line x1="32" y1="26" x2="20.4" y2="16.6"/>
  </g>
  <circle cx="32" cy="26" r="4" fill="#F4F2E8"/>
</svg>
